# Pop Pocket: Slime & Fidgets — build dans le CLOUD avec Codemagic
# (même principe que perfect-time-expo : ce fichier pilote le build,
#  il n'y a rien à faire sur le PC, juste cliquer sur "Start new build")
#
# Pourquoi iOS marche ici : Unity (sur le PC) a déjà fabriqué le projet
# Xcode, commité dans Builds/iOS/XcodeProject. Le Mac de Codemagic n'a
# plus qu'à l'assembler en .ipa — sans compte Apple Developer
# (CODE_SIGNING_ALLOWED=NO → l'ipa se signe ensuite avec AltStore/Sideloadly).

workflows:
  ios-workflow:
    name: PopPocket iOS — IPA
    max_build_duration: 120
    environment:
      xcode: latest
      vars:
        XCODE_PROJECT: Builds/iOS/XcodeProject/Unity-iPhone.xcodeproj
    scripts:
      # IMPORTANT : set -e = en cas d'erreur, STOP. Sans ça, Codemagic
      # continue après un échec et fabrique des ipa vides (166 octets !).
      - name: Telecharge les gros fichiers Git LFS (OBLIGATOIRE)
        script: |
          set -e
          cd $CM_BUILD_DIR
          git lfs pull
          ls -la Builds/iOS/XcodeProject/Libraries/
          # Le vrai libiPhone-lib.a fait 229 Mo. Si c'est encore un
          # pointeur (~150 octets), git lfs a raté → on STOPPE tout.
          test "$(stat -f %z Builds/iOS/XcodeProject/Libraries/libiPhone-lib.a)" -gt 100000000

      - name: Assemble l'application (sans signature)
        script: |
          set -e
          cd $CM_BUILD_DIR
          xcodebuild -project "$XCODE_PROJECT" \
            -scheme Unity-iPhone \
            -sdk iphoneos -configuration Release \
            -derivedDataPath Builds/iOS/XcodeProject/build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO

      - name: Fabrique l'IPA (avec verifications)
        script: |
          set -e
          cd $CM_BUILD_DIR
          APP_DIR="Builds/iOS/XcodeProject/build/Build/Products/Release-iphoneos/Unity-iPhone.app"
          if [ ! -d "$APP_DIR" ]; then
            echo "ERREUR : l'app n'a pas été produite — regarde le log xcodebuild au-dessus"
            exit 1
          fi
          du -sh "$APP_DIR"
          rm -rf Payload PopPocket.ipa
          mkdir Payload
          cp -R "$APP_DIR" Payload/
          zip -r PopPocket.ipa Payload
          ls -la PopPocket.ipa
          echo "IPA PRETE ✔"

    artifacts:
      - PopPocket.ipa