# Construit l'IPA dans le CLOUD (serveur Mac de GitHub, gratuit pour les
# dépôts publics). On branche le projet Xcode généré par Unity dans le dossier
# Builds/iOS/XcodeProject — xcodebuild assemble l'application SANS signature
# (elle pourra ensuite être installée sur l'iPhone via AltStore / Sideloadly).
name: Build-iOS

on:
  workflow_dispatch:   # bouton "Run workflow" sur GitHub
  push:
    paths: ["Builds/iOS/**"]

jobs:
  build-ipa:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Assemble l'application (sans signature)
        run: |
          cd "Builds/iOS/XcodeProject"
          xcodebuild -project Unity-iPhone.xcodeproj -scheme Unity-iPhone \
            -sdk iphoneos -configuration Release \
            -derivedDataPath build CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO | tail -20

      - name: Fabrique l'IPA (zip de Payload)
        run: |
          mkdir -p Payload
          cp -R "Builds/iOS/XcodeProject/build/Build/Products/Release-iphoneos/Unity-iPhone.app" Payload/
          zip -r PopPocket.ipa Payload
          ls -la PopPocket.ipa

      - name: Met l'IPA en pièce jointe du run
        uses: actions/upload-artifact@v4
        with:
          name: PopPocket-ipa
          path: PopPocket.ipa